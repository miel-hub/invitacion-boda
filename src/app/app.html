<!-- ================= PANTALLA 1: LA TAPA ================= -->
@if (!invitacionAbierta) {
  <div class="pantalla-tapa">
    <div class="contenedor-tapa">
      <img src="1.png" class="img-base" alt="Portada de Invitación">
      <!-- Botón sobre el sello de cera -->
      <div class="boton-abrir" (click)="abrirInvitacion()"></div>
    </div>
  </div>
}

<!-- ================= PANTALLA 2: EL INTERIOR ================= -->
@if (invitacionAbierta) {
  <div class="pantalla-interior animacion-aparecer">

    <!-- AUDIO -->
    <audio id="miMusica" src="cancion.mp3" loop></audio>

    <!-- IMAGEN 2 (Audio, Nombres, Contador y Mapas) -->
    <div class="bloque-imagen">
      <img src="2.png" class="img-base" alt="Detalles Boda">

      <!-- Botón de Audio -->
      <div class="boton-audio" (click)="reproducirMusica()"></div>

      <!-- Contador -->
      <div class="contenedor-contador">
        <div class="numero-tiempo">{{ dias }}</div>
        <div class="dos-puntos">:</div>
        <div class="numero-tiempo">{{ horas }}</div>
        <div class="dos-puntos">:</div>
        <div class="numero-tiempo">{{ minutos }}</div>
        <div class="dos-puntos">:</div>
        <div class="numero-tiempo">{{ segundos }}</div>
      </div>

      <!-- Botones de Ubicación -->
      <div class="boton-ceremonia" (click)="abrirUbicacionCeremonia()"></div>
      <div class="boton-recepcion" (click)="abrirUbicacionRecepcion()"></div>
    </div>

    <!-- IMAGEN 3 (Código de vestimenta y Formulario) -->
    <div class="bloque-imagen">
      <img src="3.png" class="img-base" alt="Dresscode y Confirmación">

     <!-- Formulario 100% Silencioso para Google Sheets -->
      <form id="formulario-asistencia" (submit)="enviarFormulario($event)">

        <!-- Input para el nombre -->
        <input type="text" name="Nombre" class="input-nombre" placeholder="Nombres y Apellidos" required>

        <!-- Botón Enviar (Tipo submit) -->
        <button type="submit" class="boton-enviar"></button>
      </form>
    </div>

  </div>
}
